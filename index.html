<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121214">
  <title>RQUM Intel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon32.png">
  <link rel="apple-touch-icon" href="icons/icon128.png">
  <link rel="stylesheet" href="rqum/rqum.css">
  <link rel="stylesheet" href="web.css">
</head>
<body>
  <header class="top">
    <img src="icons/header-eye.png" alt="" class="top__eye">
    <h1>RQUM Intel</h1>
    <span class="top__version">v1.1.1</span>
    <label class="top__accent" title="Main colour of RQUM (double-click: back to gold)"><input type="color" id="accent" aria-label="Main colour"></label>
    <button type="button" id="logout" class="link" hidden>Sign out</button>
  </header>

  <!-- Shown until a valid personal key is saved on this device. -->
  <form id="login" class="login" hidden>
    <p>RQUM is reserved to the RQUM alliance. Enter your in-game name and the personal key the admin gave you. They are remembered on this device.</p>
    <input id="name" type="text" autocomplete="username" placeholder="In-game name" required>
    <input id="key" type="password" autocomplete="current-password" placeholder="Personal key (rqum-…)" required>
    <button type="submit">Open</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>

  <main id="app" hidden>
    <nav class="tabs">
      <button type="button" data-tab="search">Players</button>
      <button type="button" data-tab="recent">Recent</button>
      <button type="button" data-tab="alliance">RQUM</button>
      <button type="button" data-tab="tgo">TGO</button>
      <button type="button" data-tab="ranking">Ranking</button>
      <button type="button" data-tab="leaderboards">Leaderboards</button>
      <button type="button" data-tab="ffa">FFA</button>
      <button type="button" data-tab="clans">Clans</button>
      <button type="button" data-tab="add">Add</button>
      <button type="button" data-tab="mine" id="mine-tab" hidden>My entries</button>
      <button type="button" id="expand" class="tabs__expand" title="Open in a big window" aria-label="Open in a big window">⤢</button>
    </nav>
    <section id="body"></section>
    <p id="status" class="status"></p>
  </main>

  <script src="rqum/common.js"></script>
  <script src="rqum/parsers.js"></script>
  <script src="rqum/bigview.js"></script>
  <script src="ocr.js"></script>
  <script src="app.js"></script>
</body>
</html>
